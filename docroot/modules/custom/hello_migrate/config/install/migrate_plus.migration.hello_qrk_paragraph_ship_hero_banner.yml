id: hello_qrk_paragraph_ship_hero_banner
label: 'Hello Paragraph: QRK Ship Hero Banner'

source:
  plugin: dynamic_url
  data_fetcher_plugin: http_archive
  data_parser_plugin: json_single_item
  index_url: https://www.quarkexpeditions.com/api/public/1/ship
  detail_url: https://www.quarkexpeditions.com/api/public/1/ship/{id}
  exclude_ids:
    - 11006
  artifact_directory: 'private://migration-artifacts/qrk/ship'

  parent_fields:
    id: ship_nid
    ship_name: ship_name

  item_selector: hero_image

  fields:
    -
      name: ship_nid
      label: 'Ship Node ID'
      selector: ship_nid
    -
      name: ship_name
      label: 'Ship Name'
      selector: ship_name
    -
      name: source_url
      label: 'Source URL'
      selector: fullsize_url
    -
      name: title
      label: 'Title'
      selector: title
    -
      name: alt
      label: 'Alt text'
      selector: alt

  ids:
    ship_nid:
      type: integer
    source_url:
      type: string

destination:
  plugin: entity_reference_revisions:paragraph
  default_bundle: hero_banner

process:
  field_hero_banner_title: ship_name

  field_hero_banner_image/target_id:
    plugin: migration_lookup
    migration: hello_qrk_media_ship_hero_image
    source: source_url
    no_stub: true

  status:
    plugin: default_value
    default_value: 1

migration_dependencies:
  required: []
  optional:
    - hello_qrk_media_ship_hero_image
migration_tags:
  - hello
  - hello_qrk
  - hello_paragraph
  - hello_hero_banner
  - hello_ship
migration_group: hello_paragraphs
