id: hello_qrk_node_departure
label: 'Hello Node: QRK: Departure'

source:
  plugin: dynamic_url
  data_fetcher_plugin: http_archive
  data_parser_plugin: json_single_item
  index_url: https://www.quarkexpeditions.com/api/public/1/departure
  detail_url: https://www.quarkexpeditions.com/api/public/1/departure/{id}
  exclude_ids: []
  artifact_directory: 'private://migration-artifacts/qrk/departure'

  parent_fields:
    id: departure_nid

  item_selector: ''

  fields:
    -
      name: id
      label: 'ID'
      selector: id
    -
      name: title
      label: 'Departure Title'
      selector: departure_name
    -
      name: departure_id
      label: 'Departure ID'
      selector: departure_id
    -
      name: expedition_nid
      label: 'Expedition Node ID'
      selector: expedition_id
    -
      name: itinerary_nid
      label: 'Itinerary Node ID'
      selector: itinerary_id
    -
      name: ship_id
      label: 'Ship ID'
      selector: ship_id
    -
      name: ship_name
      label: 'Ship Name'
      selector: ship_name
    -
      name: duration_days
      label: 'Duration Days'
      selector: duration_days
    -
      name: start_date
      label: 'Start Date'
      selector: start_date
    -
      name: end_date
      label: 'End Date'
      selector: end_date
    -
      name: start_location
      label: 'Start Date'
      selector: start_location
    -
      name: end_location
      label: 'End Location'
      selector: end_location
    -
      name: languages
      label: 'Languages'
      selector: languages

  ids:
    id:
      type: string

destination:
  plugin: entity:node
  default_bundle: departure

process:
  title: title
  field_departure_id: departure_id
  field_itinerary:
    plugin: migration_lookup
    migration: hello_qrk_entity_itinerary
    source: itinerary_nid
    no_stub: true

  field_parent_expedition:
    plugin: migration_lookup
    migration: hello_qrk_node_expedition
    source: expedition_nid
    no_stub: true

  field_ship:
    plugin: entity_lookup
    source: ship_id
    entity_type: node
    value_key: field_ship_id
    bundle_key: type
    bundle: ship

  field_operator/target_id:
    plugin: default_value
    default_value: 15


  field_departure_date/value: start_date
  field_departure_date/end_value: end_date
  field_duration: duration_days
  field_start_location_text: start_location
  field_end_location_text: end_location

  field_languages:
    plugin: entity_lookup
    source: languages
    entity_type: taxonomy_term
    value_key: field_language_code
    bundle_key: vid
    bundle: languages
    ignore_case: true

# Items we need to get from the related itinerary. Do we really need to store the on the departure node?
# field_season: season
# field_embarkation_port
# field_disembarkation_port

migration_dependencies:
  required:
    - hello_qrk_entity_itinerary
  optional: []
migration_tags:
  - hello
  - hello_qrk
  - hello_node
  - hello_departure
migration_group: hello_nodes
