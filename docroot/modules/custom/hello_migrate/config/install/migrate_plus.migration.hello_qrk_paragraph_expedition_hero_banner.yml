id: hello_qrk_paragraph_expedition_hero_banner
label: 'Hello Paragraph: QRK Expedition Hero Banner'

source:
  plugin: dynamic_url
  data_fetcher_plugin: http_archive
  data_parser_plugin: json_single_item
  index_url: https://www.quarkexpeditions.com/api/public/1/expedition
  detail_url: https://www.quarkexpeditions.com/api/public/1/expedition/{id}
  exclude_ids: []
  artifact_directory: 'private://migration-artifacts/qrk/expedition'

  parent_fields:
    id: expedition_id
    expedition_name: expedition_name

  item_selector: hero_image

  fields:
    -
      name: expedition_id
      label: 'Expedition ID'
      selector: expedition_id
    -
      name: expedition_name
      label: 'Expedition Name'
      selector: expedition_name
    -
      name: source_url
      label: 'Source URL'
      selector: fullsize_url
    -
      name: title
      label: 'Title'
      selector: title
    -
      name: alt
      label: 'Alt text'
      selector: alt

  ids:
    expedition_id:
      type: integer
    source_url:
      type: string

destination:
  plugin: entity_reference_revisions:paragraph
  default_bundle: hero_banner

process:
  field_hero_banner_title: expedition_name

  field_hero_banner_image/target_id:
    plugin: migration_lookup
    migration: hello_qrk_media_expedition_hero_image
    source: source_url
    no_stub: true

  status:
    plugin: default_value
    default_value: 1

migration_dependencies:
  required: []
  optional:
    - hello_qrk_media_expedition_hero_image
migration_tags:
  - hello
  - hello_qrk
  - hello_paragraph
  - hello_hero_banner
  - hello_expedition
migration_group: hello_paragraphs
